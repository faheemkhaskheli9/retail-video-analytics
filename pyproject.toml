[project]
name = "retail-video-analytics"
version = "0.1.0"
description = "Retail Video Analytics Platform"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.1,<9"]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
