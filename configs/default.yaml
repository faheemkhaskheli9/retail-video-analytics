# Default pipeline configuration.
#
# video_source: path to a video file, or the literal string "synthetic" to
# run the offline demo scene (see src/retail_video_analytics/synthetic.py).
video_source: synthetic
frame_stride: 1
fps: 15.0
cashier_absence_seconds: 5.0   # short for the demo; a real deployment would use 60-120s

detector:
  backend: hog          # "hog" (offline, ships with opencv-python) or "yolo" (needs ultralytics + weights download)
  confidence_threshold: 0.4
  yolo_model: yolov8n.pt
  yolo_device: cpu

tracker:
  max_age: 10
  iou_threshold: 0.3
  min_hits: 1

storage:
  backend: sqlite
  path: data/analytics.db

# Zones are polygons in frame pixel coordinates (assumes a 640x480 frame,
# matching the synthetic demo resolution -- adjust to your camera's
# resolution for real footage).
zones:
  - name: entrance
    kind: entrance
    polygon:
      - [0, 0]
      - [160, 0]
      - [160, 480]
      - [0, 480]
  - name: checkout_counter
    kind: checkout_counter
    polygon:
      - [480, 150]
      - [640, 150]
      - [640, 330]
      - [480, 330]
  - name: sales_floor
    kind: generic
    polygon:
      - [160, 0]
      - [480, 0]
      - [480, 480]
      - [160, 480]
